<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ペンギンの氷の島 3D風ぼうけん</title><style>*{box-sizing:border-box}body{margin:0;background:#071b32;color:#e8f8ff;font-family:system-ui,'Noto Sans JP',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#hud>div{background:#092b48d9;border:1px solid #8ce7ff77;border-radius:15px;padding:10px 14px;box-shadow:0 6px 20px #0005;font-weight:700;font-size:14px}#info{position:fixed;left:50%;bottom:17px;transform:translateX(-50%);background:#092b48e8;border:1px solid #a4ecff88;border-radius:18px;padding:9px 16px;text-align:center;min-width:260px;max-width:90vw;font-size:13px;pointer-events:none}#pad{position:fixed;bottom:92px;left:20px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:3px;touch-action:none}button{font:inherit;color:white;border:1px solid #b9f7ff9c;background:#15547acb;border-radius:14px;box-shadow:0 4px 12px #0005;touch-action:none;user-select:none}#pad button{font-size:24px}#pad button:active,#actions button:active{background:#32a5d5}#actions{position:fixed;right:18px;bottom:105px;display:flex;gap:10px;flex-direction:column}#actions button{padding:14px 16px;font-weight:800}#welcome{position:fixed;inset:0;background:#04162be8;display:grid;place-items:center;z-index:3;padding:22px}#welcome .panel{max-width:470px;text-align:center;background:#0c3455;border:1px solid #8deaff8c;border-radius:24px;padding:25px;box-shadow:0 20px 60px #0008}h1{font-size:25px;margin:4px 0 10px}p{line-height:1.7;font-size:14px}#start{padding:13px 36px;background:#128cc0;font-weight:800;font-size:18px}#toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:#123d5aef;padding:10px 17px;border-radius:15px;font-weight:700;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;max-width:85vw}#toast.show{opacity:1}@media(min-width:900px){#pad{opacity:.55}#actions{bottom:40px}#info{bottom:18px}}@media(max-width:420px){#hud>div{font-size:11px;padding:8px}#pad{left:8px;bottom:85px;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px)}#actions{right:8px;bottom:95px}#actions button{padding:11px 12px}}</style></head><body><canvas id="game"></canvas><div id="hud"><div>🐧 ペンギンの氷の島<br><span id="area">❄️ 雪原</span></div><div>🐟 <span id="fish">0</span>/12　💎 <span id="gem">0</span>/3<br>🏆 <span id="goal">冒険中</span></div></div><div id="toast"></div><div id="info">矢印 / WASDで移動 · Spaceで滑る · Eで調べる</div><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><span></span><button data-dir="down">▼</button><span></span><button data-dir="right">▶</button><span></span></div><div id="actions"><button id="slide">🛷 滑る</button><button id="interact">✨ 調べる</button></div><div id="welcome"><div class="panel"><div style="font-size:58px">🐧🏔️🧊</div><h1>ペンギンの氷の島</h1><p>雪山を登り、海を泳ぎ、氷の洞窟を探検しよう！<br>洞窟の奥には秘密の島への入口があるよ。<br><b>魚12匹と宝石3個</b>を見つけるとクリア！</p><p>PC：WASD / 矢印キーで移動、Spaceで滑る、Eで調べる<br>スマホ：画面のボタンで操作</p><button id="start">冒険スタート ▶</button></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const el=id=>document.getElementById(id);let started=false,mode='world',t=0,slide=0,toastUntil=0;const keys=new Set(),touch=new Set();const player={x:1.5,y:1.5,vx:0,vy:0,dir:1};const worldW=23,worldH=19;const fish=[],gems=[];let collectedF=0,collectedG=0;const rnd=(x,y)=>{let a=Math.sin(x*127.1+y*311.7)*43758.5453;return a-Math.floor(a)};const inRect=(x,y,a,b,w,h)=>x>=a&&y>=b&&x<a+w&&y<b+h;function terrain(x,y){if(x<0||y<0||x>=worldW||y>=worldH)return'water';if(inRect(x,y,15,2,7,7))return'secret';if(inRect(x,y,13,9,9,9))return'water';if(inRect(x,y,0,0,2,3)||inRect(x,y,0,0,3,2))return'snow';if(inRect(x,y,8,2,6,7))return'mountain';if(inRect(x,y,2,12,8,5))return'ice';if(inRect(x,y,10,12,4,4))return'water';if(inRect(x,y,0,0,15,12))return'snow';return'water'}const caveEntrance={x:11,y:5},secretPortal={x:16,y:5};const itemsF=[[3,3],[5,6],[7,10],[4,14],[8,15],[11,10],[9,4],[12,7],[16,4],[19,6],[12,14],[17,13]],itemsG=[[12,3],[18,3],[6,15]];itemsF.forEach((p,i)=>fish.push({x:p[0]+.5,y:p[1]+.5,id:i,got:false}));itemsG.forEach((p,i)=>gems.push({x:p[0]+.5,y:p[1]+.5,id:i,got:false}));const caveF=[{x:3.5,y:3.5,id:12,got:false},{x:7.5,y:5.5,id:13,got:false}],caveG=[{x:8.5,y:2.5,id:3,got:false}];let save={};try{save=JSON.parse(localStorage.getItem('penguin_ice_3d_v1')||'{}')}catch{};if(save.f)fish.forEach(q=>q.got=save.f.includes(q.id));if(save.g)gems.forEach(q=>q.got=save.g.includes(q.id));if(save.cf)caveF.forEach(q=>q.got=save.cf.includes(q.id));if(save.cg)caveG.forEach(q=>q.got=save.cg.includes(q.id));collectedF=[...fish,...caveF].filter(q=>q.got).length;collectedG=[...gems,...caveG].filter(q=>q.got).length;if(save.x&&save.y&&save.mode==='world'){player.x=save.x;player.y=save.y}function persist(){try{localStorage.setItem('penguin_ice_3d_v1',JSON.stringify({f:fish.filter(q=>q.got).map(q=>q.id),g:gems.filter(q=>q.got).map(q=>q.id),cf:caveF.filter(q=>q.got).map(q=>q.id),cg:caveG.filter(q=>q.got).map(q=>q.id),x:mode==='world'?player.x:3,y:mode==='world'?player.y:3,mode}))}catch{}}function msg(s){el('toast').textContent=s;el('toast').classList.add('show');toastUntil=performance.now()+2500}function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}let scale,originX,originY;function project(x,y,z=0){return {x:originX+(x-y)*scale,y:originY+(x+y)*scale*.47-z*scale*.75}}function tile(x,y,kind){let z=kind==='mountain'?Math.max(.3,1.35-Math.abs(x-10.5)*.16-Math.abs(y-5)*.10):kind==='secret'?.23:kind==='snow'?.12:kind==='ice'?.06:0;let p=project(x,y,z),r=project(x+1,y,z),b=project(x+1,y+1,z),l=project(x,y+1,z);const col={water:'#267ba8',snow:'#d9f6fc',mountain:'#b8d9e9',ice:'#80dce8',secret:'#a4ecda'}[kind];if(z){let q=project(x+1,y+1,0);poly([[r.x,r.y],[b.x,b.y],[q.x,q.y],[project(x+1,y,0).x,project(x+1,y,0).y]],kind==='mountain'?'#7194b4':'#77b9cb');poly([[l.x,l.y],[b.x,b.y],[q.x,q.y],[project(x,y+1,0).x,project(x,y+1,0).y]],'#91c3d1')}poly([[p.x,p.y],[r.x,r.y],[b.x,b.y],[l.x,l.y]],col,kind==='water'?'#328bb4':'#ffffff35');if(kind==='water'&&rnd(x,y)>.72){ctx.strokeStyle='#b2f7ff75';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+scale*.4,p.y+scale*.18);ctx.lineTo(p.x+scale*.75,p.y+scale*.22);ctx.stroke()}if(kind==='ice'&&rnd(x,y)>.52){ctx.strokeStyle='#d7ffffaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x+scale*.2,p.y+scale*.24);ctx.lineTo(p.x+scale*.45,p.y+scale*.31);ctx.lineTo(p.x+scale*.6,p.y+scale*.24);ctx.stroke()}if(kind==='mountain'&&rnd(x,y)>.5){poly([[p.x,p.y-8],[p.x-6,p.y+5],[p.x+7,p.y+5]],'#ffffffc9')}if(kind==='snow'&&rnd(x,y)>.83){ellipse(p.x,p.y+8,3,2,'#ffffff')}}function penguin(x,y,water=false){let p=project(x,y,terrain(Math.floor(x),Math.floor(y))==='mountain'?.55:0);let bob=Math.sin(t*5)*2;ellipse(p.x,p.y+7,scale*.25,scale*.10,'#15304d55');ctx.save();ctx.translate(p.x,p.y-13+bob+(water?8:0));ctx.rotate(Math.max(-.22,Math.min(.22,player.vx*.12)));ellipse(0,0,scale*.20,scale*.34,'#182c43');ellipse(0,scale*.035,scale*.135,scale*.245,'#f8ffff');ellipse(-scale*.085,-scale*.17,scale*.028,scale*.04,'#fff');ellipse(scale*.085,-scale*.17,scale*.028,scale*.04,'#fff');ellipse(-scale*.085,-scale*.17,scale*.014,scale*.023,'#102039');ellipse(scale*.085,-scale*.17,scale*.014,scale*.023,'#102039');poly([[0,-scale*.095],[-scale*.07,-scale*.04],[scale*.07,-scale*.04]],'#f3a94d');ellipse(-scale*.14,scale*.29,scale*.09,scale*.04,'#f6a44d');ellipse(scale*.14,scale*.29,scale*.09,scale*.04,'#f6a44d');ctx.restore();if(water){ctx.strokeStyle='#d9ffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y+8,scale*.28,scale*.13,0,0,Math.PI*2);ctx.stroke()}}function iconAt(x,y,emoji,z=0){let p=project(x,y,z);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.max(18,scale*.53)}px system-ui`;ctx.fillText(emoji,p.x,p.y-14+Math.sin(t*3+x)*3)}function sign(x,y,label){let p=project(x,y,.3);roundRect(p.x-46,p.y-65,92,26,8,'#174b6d');ctx.fillStyle='#e8ffff';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText(label,p.x,p.y-48);ctx.strokeStyle='#7b5139';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x,p.y-39);ctx.lineTo(p.x,p.y-5);ctx.stroke()}function caveFloor(x,y){if(x<0||y<0||x>=11||y>=9)return'wall';if(x===0||y===0||x===10||y===8)return'wall';if(inRect(x,y,4,2,2,4)||inRect(x,y,2,6,5,1))return'wall';return'floor'}function drawCave(){ctx.fillStyle='#09182e';ctx.fillRect(0,0,W,H);scale=Math.max(20,Math.min(48,W/18,H/12));originX=W/2;originY=H*.13;for(let sum=0;sum<22;sum++)for(let x=0;x<11;x++){let y=sum-x;if(y<0||y>=9)continue;let wall=caveFloor(x,y)==='wall';let p=project(x,y,wall?.85:0),r=project(x+1,y,wall?.85:0),b=project(x+1,y+1,wall?.85:0),l=project(x,y+1,wall?.85:0);if(wall){poly([[p.x,p.y],[r.x,r.y],[b.x,b.y],[l.x,l.y]],'#5e90b6','#95c7df');let bp=project(x+1,y+1,0);poly([[l.x,l.y],[b.x,b.y],[bp.x,bp.y],[project(x,y+1,0).x,project(x,y+1,0).y]],'#2a5378')}else{poly([[p.x,p.y],[r.x,r.y],[b.x,b.y],[l.x,l.y]],rnd(x,y)>.5?'#2c6686':'#326f8e','#9feeff24');if(rnd(x,y)>.82)iconAt(x+.5,y+.5,'✨')}}caveF.filter(q=>!q.got).forEach(q=>iconAt(q.x,q.y,'🐟'));caveG.filter(q=>!q.got).forEach(q=>iconAt(q.x,q.y,'💎'));iconAt(8.5,6.5,'🚪');iconAt(1.5,1.5,'⬆️');penguin(player.x,player.y)}function drawWorld(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7ed3ef');sky.addColorStop(.6,'#bcefff');sky.addColorStop(1,'#e0fbff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);scale=Math.max(18,Math.min(38,W/26,H/19));originX=W/2-(player.x-player.y)*scale;originY=H*.48-(player.x+player.y)*scale*.47;for(let sum=0;sum<worldW+worldH-1;sum++)for(let x=0;x<worldW;x++){let y=sum-x;if(y<0||y>=worldH)continue;tile(x,y,terrain(x,y))}sign(10.8,5.2,'🕳️ 氷の洞窟');sign(15.8,4.2,'🌟 秘密の島');for(let i=0;i<13;i++){let x=(i*7+3)%23,y=(i*11+5)%19;if(terrain(x,y)==='snow'&&rnd(x,y)>.35)iconAt(x+.5,y+.5,'🌲',.15)}fish.filter(q=>!q.got).forEach(q=>iconAt(q.x,q.y,'🐟',terrain(Math.floor(q.x),Math.floor(q.y))==='mountain'?.6:0));gems.filter(q=>!q.got).forEach(q=>iconAt(q.x,q.y,'💎',terrain(Math.floor(q.x),Math.floor(q.y))==='mountain'?.6:0));iconAt(11.5,5.5,'🕳️',.75);iconAt(16.5,5.5,'🏰',.23);penguin(player.x,player.y,terrain(Math.floor(player.x),Math.floor(player.y))==='water');let p=project(player.x,player.y);if(slide>0){ctx.strokeStyle='#f6ffffc9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-12,p.y+16);ctx.lineTo(p.x-28,p.y+22);ctx.stroke()}}function canGo(x,y){if(mode==='cave')return caveFloor(Math.floor(x),Math.floor(y))==='floor';return x>.2&&y>.2&&x<worldW-.2&&y<worldH-.2}function near(x,y,r=1.15){return Math.hypot(player.x-x,player.y-y)<r}function interact(){if(mode==='world'&&near(11.5,5.5,1.65)){mode='cave';player.x=1.5;player.y=1.5;player.vx=player.vy=0;msg('🕳️ 氷の洞窟に入った！ 奥を探索しよう');persist();return}if(mode==='cave'&&near(1.5,1.5,1.4)){mode='world';player.x=11.5;player.y=6.6;player.vx=player.vy=0;msg('❄️ 雪山に戻った');persist();return}if(mode==='cave'&&near(8.5,6.5,1.5)){mode='world';player.x=16.5;player.y=5.5;player.vx=player.vy=0;msg('🌟 秘密の島を発見した！');persist();return}if(mode==='world'&&near(16.5,5.5,1.4)){mode='cave';player.x=8.5;player.y=6.5;player.vx=player.vy=0;msg('🕳️ 秘密の通路から洞窟へ！');persist();return}msg('近くの洞窟や扉で「調べる」を押してね')}function update(dt){if(!started)return;t+=dt;let dx=(keys.has('ArrowRight')||keys.has('d')||touch.has('right')?1:0)-(keys.has('ArrowLeft')||keys.has('a')||touch.has('left')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')||touch.has('down')?1:0)-(keys.has('ArrowUp')||keys.has('w')||touch.has('up')?1:0);let length=Math.hypot(dx,dy);if(length){dx/=length;dy/=length;player.dir=dx||player.dir}let terr=mode==='cave'?'cave':terrain(Math.floor(player.x),Math.floor(player.y));let slippery=terr==='ice'||slide>0;let speed=terr==='water'?2.2:terr==='mountain'?2.3:slippery?5.2:3.4;let blend=slippery?Math.min(1,dt*2.3):Math.min(1,dt*12);player.vx+=(dx*speed-player.vx)*blend;player.vy+=(dy*speed-player.vy)*blend;if(slide>0)slide=Math.max(0,slide-dt);let nx=player.x+player.vx*dt,ny=player.y+player.vy*dt;if(canGo(nx,player.y))player.x=nx;else player.vx=0;if(canGo(player.x,ny))player.y=ny;else player.vy=0;let fs=mode==='cave'?caveF:fish,gs=mode==='cave'?caveG:gems;let got=false;fs.forEach(q=>{if(!q.got&&near(q.x,q.y,.52)){q.got=true;collectedF++;got=true;msg('🐟 魚をゲット！')}});gs.forEach(q=>{if(!q.got&&near(q.x,q.y,.55)){q.got=true;collectedG++;got=true;msg('💎 宝石を発見！')}});if(got)persist();el('fish').textContent=collectedF;el('gem').textContent=collectedG;el('area').textContent=mode==='cave'?'🕳️ 氷の洞窟':terr==='secret'?'🌟 秘密の島':terr==='mountain'?'🏔️ 雪山':terr==='water'?'🌊 氷の海':terr==='ice'?'🧊 つるつる氷原':'❄️ 雪原';if(collectedF>=12&&collectedG>=3){el('goal').textContent='島の探検家！';if(!window.__won){window.__won=true;msg('🏆 おめでとう！ 全ての宝物を集めた！')}}if(performance.now()>toastUntil)el('toast').classList.remove('show')}function slideNow(){if(!started)return;slide=1.4;let dx=(keys.has('ArrowRight')||keys.has('d')||touch.has('right')?1:0)-(keys.has('ArrowLeft')||keys.has('a')||touch.has('left')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')||touch.has('down')?1:0)-(keys.has('ArrowUp')||keys.has('w')||touch.has('up')?1:0);if(!dx&&!dy)dx=player.dir;let n=Math.hypot(dx,dy);player.vx=dx/n*6;player.vy=dy/n*6;msg('🛷 すいーっ！')}addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase());if(e.repeat)return;if(e.code==='Space')slideNow();if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase()));document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touch.add(d)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>touch.delete(d)))});el('slide').onclick=slideNow;el('interact').onclick=interact;el('start').onclick=()=>{started=true;el('welcome').style.display='none';msg('🐧 まずは魚を集めて、雪山の洞窟を探そう！')};let last=performance.now(),saveClock=0;function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);if(mode==='cave')drawCave();else drawWorld();saveClock+=dt;if(saveClock>8&&started){persist();saveClock=0}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>

(()=>{'use strict';if(!window.THREE){document.getElementById('error').style.display='flex';return;}const T=THREE;const scene=new T.Scene();scene.background=new T.Color(0x8dd7f5);scene.fog=new T.FogExp2(0x9ed9f1,.012);const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.insertBefore(renderer.domElement,document.body.firstChild);scene.add(new T.HemisphereLight(0xdaf7ff,0x3c6b91,2.15));const sun=new T.DirectionalLight(0xfff5db,2.35);sun.position.set(-18,32,13);scene.add(sun);const M=(c,r=.78,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const ice=M(0xc8f5ff,.28,.18),snow=M(0xf4fdff,.86),snow2=M(0xc7ebf5,.78),rock=M(0x7da6c2,.9),deep=M(0x184c72,.8),black=M(0x122b42,.55),white=M(0xf9ffff,.68),orange=M(0xffa746,.63),pink=M(0xffb6b2,.6),gemMat=new T.MeshStandardMaterial({color:0x9af5ff,emissive:0x2e9dd6,emissiveIntensity:.65,metalness:.42,roughness:.18}),fishMat=M(0xffd37b,.46,.2),waterMat=new T.MeshStandardMaterial({color:0x168ac0,transparent:true,opacity:.78,roughness:.18,metalness:.25,side:T.DoubleSide});function mesh(g,m,parent=scene){let a=new T.Mesh(g,m);parent.add(a);return a}function sphere(r,m,parent=scene,seg=16){return mesh(new T.SphereGeometry(r,seg,12),m,parent)}function box(w,h,d,m,parent=scene){return mesh(new T.BoxGeometry(w,h,d),m,parent)}function cone(r,h,m,parent=scene,n=7){return mesh(new T.ConeGeometry(r,h,n),m,parent)}function cylinder(rt,rb,h,m,parent=scene,n=12){return mesh(new T.CylinderGeometry(rt,rb,h,n),m,parent)}const world=box(94,3.6,94,deep);world.position.y=-4.1;const sea=mesh(new T.PlaneGeometry(200,200),waterMat);sea.rotation.x=-Math.PI/2;sea.position.y=-.36;function ground(x,z){let d= const player=penguin(1);scene.add(player);const friends=[];for(let i=0;i<2;i++){let f=penguin(.67);scene.add(f);friends.push(f)}const seal=new T.Group();let sb=sphere(1.1,M(0x7b9cae),seal);sb.scale.set(1.05,.55,.72);sb.position.y=.7;let sh=sphere(.65,M(0x8aaabb),seal);sh.position.set(0,.92,.74);for(let s of [-1,1]){let e=sphere(.075,black,seal);e.position.set(s*.29,1.06,1.26);let fl=sphere(.45,M(0x6e93a8),seal);fl.scale.set(.8,.25,.6);fl.position.set(s*1,.36,.2)}let nose=sphere(.13,black,seal);nose.position.set(0,.78,1.34);scene.add(seal);const pickups=[];function makeFish(x,z){let g=new T.Group();let b=sphere(.32,fishMat,g);b.scale.set(1.5,.67,.7);let tail=cone(.26,.55,orange,g,3);tail.rotation.z=Math.PI/2;tail.position.x=-.55;let e=sphere(.055,black,g,8);e.position.set(.34,.08,.19);g.position.set(x,Math.max(-.45,ground(x,z))+.85,z);scene.add(g);pickups.push({obj:g,type:'fish',x,z,got:false,phase:rnd()*6})}function makeGem(x,z){let g=new T.Group();let b=mesh(new T.OctahedronGeometry(.57),gemMat,g);b.position.y=.2;g.position.set(x,Math.max(-.45,ground(x,z))+.85,z);scene.add(g);pickups.push({obj:g,type:'gem',x,z,got:false,phase:rnd()*6})}for(let i=0;i<12;i++){let a=i*2.399,r=4+i*2.05;makeFish(Math.cos(a)*r,Math.sin(a)*r)}for(let i=0;i<5;i++){let a=i*2.6+.4,r=8+i*4.2;makeGem(Math.cos(a)*r,Math.sin(a)*r)}const snowParticles=[];const flakeGeo=new T.SphereGeometry(.06,5,4);const flakeMat=new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.75});for(let i=0;i<105;i++){let f=mesh(flakeGeo,flakeMat);f.position.set((rnd()-.5)*85,rnd()*22,(rnd()-.5)*85);snowParticles.push(f)}let state={x:0,z:3,y:ground(0,3),vy:0,dx:0,dz:0,heading:0,slide:false,dive:false,fish:0,gem:0,started:false,done:false};const joy=document.getElementById('joy'),nub=document.getElementById('nub');let pointer=null;function joyMove(e){const r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),lim=r.width*.32;state.dx=Math.max(-1,Math.mi

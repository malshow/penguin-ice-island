<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#082c4a"><title>ペンギンの氷の島 Ver.3</title>
<style>
:root{color-scheme:dark;--ink:#eaffff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#092a47;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.panel{background:rgba(4,31,59,.72);border:1px solid rgba(203,246,255,.27);border-radius:16px;padding:9px 12px;backdrop-filter:blur(9px);box-shadow:0 5px 25px #001c2d55}.brand{font-size:14px;font-weight:900;letter-spacing:.02em}.stats{font-size:12px;margin-top:3px;color:#d5f9ff}.right{font-size:12px;text-align:right;max-width:45%;line-height:1.5}#hint{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:rgba(3,34,59,.82);border:1px solid #9ceaff6e;border-radius:999px;padding:7px 14px;font-size:12px;white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis;text-align:center;transition:opacity .4s}#controls{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 15px;gap:12px;pointer-events:none}.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,49px);gap:3px;pointer-events:auto}.dpad button:nth-child(1){grid-column:2;grid-row:1}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:3;grid-row:2}.dpad button:nth-child(4){grid-column:2;grid-row:3}.actions{display:grid;grid-template-columns:repeat(2,76px);gap:9px;align-items:end;pointer-events:auto}.actions button{height:61px;border-radius:19px;font-size:13px}.actions button:nth-child(3){grid-column:1/3;height:41px}button{border:1px solid #c5faff6e;background:linear-gradient(150deg,#246c91dd,#0c3659e8);color:white;font-weight:800;font-family:inherit;border-radius:16px;box-shadow:0 5px 15px #001a32a6;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.dpad button{font-size:23px}button:active,button.pressed{background:#47bcd1;transform:scale(.96)}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#02172fc9,#034969b5);pointer-events:auto;padding:18px}#overlay.hidden{display:none}.modal{width:min(440px,100%);background:linear-gradient(155deg,#10466a,#082d51);border:1px solid #a1e8ff70;border-radius:28px;padding:25px 23px;box-shadow:0 15px 80px #00121fbb;text-align:center}.modal .hero{font-size:57px}.modal h1{font-size:25px;margin:10px 0}.modal p{line-height:1.8;font-size:14px;color:#d6f7ff}.modal button{padding:15px 30px;margin-top:10px;font-size:17px;background:linear-gradient(135deg,#33a8c9,#176b96)}#toast{position:absolute;top:132px;left:50%;transform:translateX(-50%);background:#0c365ce8;border:1px solid #80e7ff7a;border-radius:12px;padding:9px 14px;font-size:13px;opacity:0;transition:opacity .25s;text-align:center;max-width:90%;white-space:normal}#footer{position:absolute;bottom:max(176px,calc(env(safe-area-inset-bottom) + 170px));left:50%;transform:translateX(-50%);font-size:11px;text-shadow:0 2px 4px #003;opacity:.8;white-space:nowrap}@media(max-height:620px){#hint{top:68px}#toast{top:101px}#footer{display:none}.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px)}.actions button{height:47px}.actions button:nth-child(3){height:34px}}
</style></head><body><canvas id="game" aria-label="ペンギンの氷の島ゲーム"></canvas><div id="hud"><div id="top"><div class="panel"><div class="brand">🐧 ペンギンの氷の島 <span style="color:#9ef5ff">Ver.3</span></div><div class="stats" id="stats">🐟 0/12　💎 0/3　🗝️ 0/1</div></div><div class="panel right"><div id="zone">❄️ 雪原</div><div id="mode">🚶 歩行中</div></div></div><div id="hint">氷の島を探検しましょう！</div><div id="toast"></div><div id="footer">氷の上で滑走 ／ 海で潜水 ／ 雪山でジャンプ</div><div id="controls"><div class="dpad"><button data-dir="up" aria-label="上へ">▲</button><button data-dir="left" aria-label="左へ">◀</button><button data-dir="right" aria-label="右へ">▶</button><button data-dir="down" aria-label="下へ">▼</button></div><div class="actions"><button id="slide">🛷<br>滑る</button><button id="jump">⬆️<br>ジャンプ</button><button id="dive">🌊 潜る / 浮上</button></div></div><div id="overlay"><div class="modal"><div class="hero">🐧🏔️🌊</div><h1 id="modalTitle">ペンギンの氷の島 Ver.3</h1><p id="modalText">雪山を滑り、ジャンプで氷の割れ目を越え、海に潜って魚と宝石を集めましょう。<br>氷の洞窟には秘密の鍵があります。<br><strong>魚12匹・宝石3個・鍵1個</strong>を集めるとクリア！<br>仲間のペンギンとアザラシも登場します。</p><button id="start">冒険スタート ▶</button><p style="font-size:11px;margin-bottom:0">iPhone：方向ボタンとアクションボタン<br>PC：矢印/WASD・Spaceで滑る・Jでジャンプ・Eで潜る</p></div></div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});const $=id=>document.getElementById(id);let W=0,H=0,dpr=1,last=0,clock=0,started=false,toastUntil=0;const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(x,y,a,b)=>Math.hypot(x-a,y-b),rnd=(n)=>{let x=Math.sin(n*127.1+93.7)*43758.5453;return x-Math.floor(x)};const world={w:2400,h:1900};const player={x:1120,y:940,vx:0,vy:0,z:0,vz:0,slide:false,dive:false,face:1};const input={up:false,down:false,left:false,right:false,slide:false};const companions=[{x:1030,y:980,type:'penguin',t:0},{x:1180,y:1020,type:'seal',t:2}];let collected=new Set(),fish=0,gems=0,key=0,cam={x:0,y:0},particles=[],wake=[],snow=[];for(let i=0;i<100;i++)snow.push({x:rnd(i+20),y:rnd(i+300),s:1+rnd(i+500)*2,v:.1+rnd(i+700)*.45});const saveKey='penguin-ice-island-v3';try{const data=JSON.parse(localStorage.getItem(saveKey)||'null');if(data&&Array.isArray(data.collected)){collected=new Set(data.collected);player.x=clamp(data.x||1120,150,2200);player.y=clamp(data.y||940,150,1760)}}catch(e){};
const items=[];function add(id,type,x,y,zone){items.push({id,type,x,y,zone})}[[1070,800],[1210,1050],[820,940],[1460,990],[1070,1300],[1350,700]].forEach((p,i)=>add('f'+i,'fish',...p,'land'));[[260,820],[420,1130],[1950,690],[2080,1020]].forEach((p,i)=>add('sea'+i,'fish',...p,'sea'));[[1800,1470],[2010,1600]].forEach((p,i)=>add('deep'+i,'fish',...p,'deep'));[[1550,310],[530,1410],[2010,1500]].forEach((p,i)=>add('gem'+i,'gem',...p,i===2?'deep':'land'));add('cavekey','key',1760,410,'cave');
function save(){try{localStorage.setItem(saveKey,JSON.stringify({collected:[...collected],x:Math.round(player.x),y:Math.round(player.y)}))}catch(e){}}function counts(){fish=items.filter(i=>i.type==='fish'&&collected.has(i.id)).length;gems=items.filter(i=>i.type==='gem'&&collected.has(i.id)).length;key=collected.has('cavekey')?1:0;$('stats').textContent=`🐟 ${fish}/12　💎 ${gems}/3　🗝️ ${key}/1`};counts();
function island(x,y){const dx=(x-1130)/810,dy=(y-925)/650;const a=dx*dx+dy*dy+0.07*Math.sin(x/120)*Math.cos(y/140);return a<1}function mountain(x,y){return x>690&&x<1700&&y<670&&island(x,y)}function cave(x,y){return x>1640&&x<1950&&y>230&&y<570}function deep(x,y){return x>1660&&y>1180&&!island(x,y)}function zoneAt(x,y){if(cave(x,y))return 'cave';if(!island(x,y))return 'sea';if(mountain(x,y))return 'mountain';return 'ice'}function zoneName(z){return {cave:'🧊 氷の洞窟',sea:'🌊 氷の海',mountain:'🏔️ 雪山',ice:'❄️ 氷の島'}[z]};
function toast(t){$('toast').textContent=t;$('toast').style.opacity='1';toastUntil=clock+3.2}function slideToggle(){if(!started)return;if(player.dive){toast('潜水中は滑れません');return}player.slide=!player.slide;toast(player.slide?'🛷 お腹で滑走！':'🐧 歩行に戻りました')}function jump(){if(!started)return;if(player.dive){toast('潜水中はジャンプできません');return}if(player.z>0)return;player.vz=9.7;player.z=1;toast('⬆️ ジャンプ！')}function diveToggle(){if(!started)return;const z=zoneAt(player.x,player.y);if(z!=='sea'){toast('🌊 海の中で「潜る」を押してください');return}player.dive=!player.dive;player.slide=false;toast(player.dive?'🐠 海底を探検！ 魚や宝石を集めましょう':'🌊 海面に戻りました')}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();const keyMap={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(keyMap[k]){input[keyMap[k]]=true;e.preventDefault()}if(e.repeat)return;if(k===' '){slideToggle();e.preventDefault()}if(k==='j'){jump();e.preventDefault()}if(k==='e'){diveToggle();e.preventDefault()}});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(keyMap[k])input[keyMap[k]]=false});window.addEventListener('blur',()=>Object.keys(input).forEach(k=>input[k]=false));document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;const down=e=>{e.preventDefault();input[k]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch(x){}};const up=e=>{e.preventDefault();input[k]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up))});$('slide').addEventListener('pointerdown',e=>{e.preventDefault();slideToggle()});$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('dive').addEventListener('pointerdown',e=>{e.preventDefault();diveToggle()});$('start').onclick=()=>{if(fish===12&&gems===3&&key===1){collected.clear();player.x=1120;player.y=940;counts();save()}$('overlay').classList.add('hidden');started=true;toast('🐧 仲間と一緒に冒険しましょう！')};
function emit(x,y,col,count=5){for(let i=0;i<count;i++){let a=Math.random()*TAU,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col})}}function update(dt){clock+=dt;if(clock>toastUntil)$('toast').style.opacity='0';if(!started)return;const oldZone=zoneAt(player.x,player.y);let ax=(input.right?1:0)-(input.left?1:0),ay=(input.down?1:0)-(input.up?1:0),mag=Math.hypot(ax,ay)||1;ax/=mag;ay/=mag;let sea=oldZone==='sea',speed=sea?(player.dive?2.8:3.3):(player.slide?5.6:3.15);if(oldZone==='mountain'&&player.slide)speed=7.2;if(player.z>0)speed*=1.15;let friction=player.slide?.976:.84;if(sea)friction=.82;let accel=player.slide?.28:.55;if(sea)accel=.42;let scale=dt*60;player.vx=(player.vx*friction+ax*accel*scale);player.vy=(player.vy*friction+ay*accel*scale);let vel=Math.hypot(player.vx,player.vy);if(vel>speed){player.vx*=speed/vel;player.vy*=speed/vel}if(oldZone==='mountain'&&player.slide)player.vy+=.095*scale;player.x=clamp(player.x+player.vx*scale,60,world.w-60);player.y=clamp(player.y+player.vy*scale,60,world.h-60);if(ax)player.face=Math.sign(ax);if(player.z>0||player.vz>0){player.z+=player.vz*scale;player.vz-=.55*scale;if(player.z<0){player.z=0;player.vz=0;emit(player.x,player.y,'#e8fbff',5)}}const newZone=zoneAt(player.x,player.y);if(newZone!=='sea'&&player.dive){player.dive=false;toast('🐧 岸に上がりました')}if(newZone==='sea'&&player.slide)player.slide=false;if(newZone!==oldZone)toast(zoneName(newZone)+' に到着！');for(const c of companions){c.t+=dt;const tx=player.x+(c.type==='penguin'?-55:58),ty=player.y+40+(c.type==='seal'?20:0);let d=dist(c.x,c.y,tx,ty);if(d>500){c.x=tx;c.y=ty}else if(d>12){c.x+=(tx-c.x)*Math.min(.085*scale,1);c.y+=(ty-c.y)*Math.min(.085*scale,1)}}for(const it of items){if(collected.has(it.id))continue;let can=it.zone==='deep'?player.dive:it.zone==='sea'?(newZone==='sea'&&!player.dive):it.zone==='cave'?newZone==='cave':newZone!=='sea';if(can&&dist(player.x,player.y,it.x,it.y)<36){collected.add(it.id);emit(it.x,it.y,it.type==='gem'?'#ee8bff':'#ffe66e',14);counts();save();toast(it.type==='fish'?'🐟 魚をゲット！':it.type==='gem'?'💎 宝石を発見！':'🗝️ 秘密の鍵を発見！');if(fish===12&&gems===3&&key===1){setTimeout(()=>{started=false;$('modalTitle').textContent='🎉 冒険クリア！';$('modalText').innerHTML='魚12匹・宝石3個・秘密の鍵をすべて発見しました！<br>ペンギンと仲間たちの大冒険、大成功です。';$('start').textContent='もう一度冒険する ▶';$('overlay').classList.remove('hidden')},900)}}}if(Math.random()<.35&&vel>1.8){wake.push({x:player.x,y:player.y+8,r:2,life:1,col:player.dive?'#4ee4ec':sea?'#a7f5ff':'#ffffff'})}wake=wake.filter(p=>(p.life-=dt*.85)>0);particles=particles.filter(p=>{p.x+=p.vx*scale;p.y+=p.vy*scale;p.life-=dt*1.2;return p.life>0});$('zone').textContent=zoneName(newZone);$('mode').textContent=player.dive?'🤿 潜水中':player.z>0?'⬆️ ジャンプ中':player.slide?'🛷 滑走中':sea?'🏊 水泳中':'🚶 歩行中';let hint=newZone==='sea'?(player.dive?'海底の魚と宝石を探しましょう':'「潜る」で海底を探検できます'):newZone==='mountain'?'「滑る」で坂を加速！ 「ジャンプ」で飛べます':newZone==='cave'?'洞窟の奥に秘密の鍵があります':'魚と宝石を集め、雪山・海・洞窟を探検！';$('hint').textContent=hint;cam.x+=(player.x-W/2-cam.x)*Math.min(.12*scale,1);cam.y+=(player.y-H*.46-cam.y)*Math.min(.12*scale,1)}
function poly(points,fill,stroke,line=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}function ellipse(x,y,rx,ry,fill,stroke,line=1){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=line;ctx.strokeStyle=stroke;ctx.stroke()}}function line(x1,y1,x2,y2,color,w=1){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function terrain(){const bg=ctx.createLinearGradient(0,0,0,world.h);bg.addColorStop(0,'#116c9e');bg.addColorStop(.7,'#08628c');bg.addColorStop(1,'#052c61');ctx.fillStyle=bg;ctx.fillRect(-200,-200,world.w+400,world.h+400);for(let i=0;i<125;i++){let x=rnd(i+700)*world.w,y=rnd(i+900)*world.h;if(island(x,y))continue;ellipse(x,y,22+rnd(i+1100)*50,3+rnd(i+1500)*4,'#a1efff16')}const coast=[];for(let i=0;i<=180;i++){let a=i/180*TAU;let r=1+.024*Math.sin(7*a)+.035*Math.cos(11*a);coast.push([1130+810*Math.cos(a)*r,925+650*Math.sin(a)*r])}poly(coast,'#d3f5f5','#70e5f3',18);ctx.save();ctx.clip();const land=ctx.createLinearGradient(500,350,1600,1450);land.addColorStop(0,'#f1fcff');land.addColorStop(.5,'#c6edf0');land.addColorStop(1,'#9dd9e6');ctx.fillStyle=land;ctx.fillRect(100,100,2200,1700);for(let i=0;i<250;i++){let x=rnd(i+1)*2400,y=rnd(i+50)*1900;ellipse(x,y,2+rnd(i+3)*7,1+rnd(i+4)*3,'#ffffff66')}for(let i=0;i<22;i++){let x=500+rnd(i+80)*1250,y=540+rnd(i+81)*850;line(x,y,x+22+rnd(i+9)*55,y-14,'#8dc9d65c',1.7)}poly([[620,500],[840,120],[1060,390],[1240,70],[1530,450],[1670,630],[1500,680],[810,650]],'#b6d8e9','#ebfbff',7);poly([[650,485],[840,120],[1030,390],[1240,70],[1510,460],[1330,370],[1180,310],[1070,480],[850,340]],'#d9eef8');poly([[745,280],[840,120],[950,280],[870,250],[840,230],[812,263]],'#ffffff');poly([[1120,230],[1240,70],[1370,270],[1260,225],[1240,210],[1190,245]],'#ffffff');for(let i=0;i<16;i++){let x=720+i*55,y=460+Math.sin(i*.7)*38;line(x,y,x+90,y+75,'#6ea9c363',3)}ctx.restore();poly([[1600,240],[1860,200],[2020,345],[1920,570],[1660,540]],'#386e91','#a6f2ff',8);poly([[1650,275],[1830,250],[1950,350],[1870,515],[1700,495]],'#153e70','#77c4ed',3);for(let i=0;i<9;i++){let x=1690+i*27;poly([[x,280],[x+15,280],[x+7,325+rnd(i+44)*50]],'#79e4ff','#b9ffff',1)}for(let i=0;i<12;i++){let x=1690+rnd(i+300)*230,y=330+rnd(i+400)*180;ellipse(x,y,3,3,'#9feaff99')}ellipse(1760,410,72,44,'#072c52','#5cb9e5',5);for(let i=0;i<18;i++){let x=300+rnd(i+400)*1700,y=260+rnd(i+800)*1350;if(!island(x,y)||mountain(x,y)||cave(x,y))continue;ellipse(x,y,16,9,'#a3d5e7');ellipse(x-3,y-3,14,7,'#ffffff')}for(let i=0;i<8;i++){let x=160+rnd(i+140)*2200,y=180+rnd(i+200)*1600;if(island(x,y))continue;poly([[x-35,y+15],[x,y-13],[x+40,y+13],[x+5,y+30]],'#ddf8ff','#83d9ec',3)}// sea treasure reef
for(let i=0;i<28;i++){let x=1670+rnd(i+70)*600,y=1190+rnd(i+100)*500;ellipse(x,y,13+rnd(i+33)*12,7,'#2b96a0a0');line(x,y,x+Math.sin(i)*11,y-14,'#4ddcc6',3)}
}
function iconItem(it){const t=clock*2+it.x*.01,up=Math.sin(t)*5;ctx.save();ctx.translate(it.x,it.y+up);if(it.type==='fish'){ctx.rotate(Math.sin(t)*.15);ellipse(0,0,14,8,'#ffcc5a','#fff0b1',1.5);poly([[10,0],[23,-9],[23,9]],'#ff8f45');ellipse(-6,-2,2,2,'#172d4a')}else if(it.type==='gem'){poly([[0,-20],[14,-7],[9,13],[0,21],[-9,13],[-14,-7]],'#c66aff','#ffefff',2);poly([[0,-20],[0,21],[9,13],[14,-7]],'#f0b7ff88')}else{ctx.font='36px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🗝️',0,0)}ctx.restore()}
function penguin(x,y,s=1,flip=1,diving=false,slide=false,z=0,friend=false){ctx.save();ctx.translate(x,y-z);ctx.scale(s*flip,s);ellipse(0,18+z,22,7,'#06284c44');if(diving){ctx.rotate(-.3);ellipse(0,1,23,13,'#132d4d','#9de6f1',2);ellipse(-7,-3,12,8,'#f4ffff');ellipse(18,-1,8,5,'#f4b96d');ellipse(-14,-3,3,3,'#fff')}else if(slide){ctx.rotate(-.2);ellipse(0,3,28,15,'#112b4d','#9ce5f1',2);ellipse(3,-1,17,10,'#f5ffff');ellipse(24,-4,8,5,'#ffba62');ellipse(13,-9,3,3,'#152a45');ellipse(-22,7,9,4,'#17395b')}else{ellipse(-12,17,9,5,'#ffb45e');ellipse(12,17,9,5,'#ffb45e');ellipse(0,-1,20,27,friend?'#23476e':'#112a4d','#b8edff',2);ellipse(2,5,14,18,'#f2fbff');ellipse(-17,5,7,14,'#16385d');ellipse(18,5,7,14,'#16385d');ellipse(-7,-12,4,5,'#fff');ellipse(9,-12,4,5,'#fff');ellipse(-6,-12,2,3,'#162c4d');ellipse(10,-12,2,3,'#162c4d');poly([[1,-7],[13,-5],[3,2]],'#ffb45e')}ctx.restore()}
function seal(x,y,s=1){ctx.save();ctx.translate(x,y+Math.sin(clock*2+x)*2);ellipse(0,15,28,7,'#07294455');ellipse(0,0,27*s,16*s,'#93c8d6','#e5faff',2);ellipse(-20,-7,15,12,'#b4e0e7');ellipse(-24,-9,3,3,'#193e58');ellipse(-10,-8,3,3,'#193e58');ellipse(-17,-3,3,2,'#2c5063');ellipse(25,4,14,6,'#75aebf');line(-17,-2,-32,-6,'#d9f7ff');line(-17,0,-32,2,'#d9f7ff');ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);terrain();for(const w of wake){ctx.globalAlpha=w.life*.65;ellipse(w.x,w.y,w.r+(1-w.life)*15,2+(1-w.life)*4,w.col);ctx.globalAlpha=1}for(const it of items){if(collected.has(it.id))continue;if(it.zone==='deep'&&!player.dive)continue;if(it.zone==='sea'&&player.dive)continue;iconItem(it)}for(const c of companions){if(c.type==='seal')seal(c.x,c.y,.8);else penguin(c.x,c.y,.77,1,false,false,0,true)}if(player.dive){ctx.fillStyle='#003f67a0';ctx.fillRect(cam.x,cam.y,W,H);for(let i=0;i<24;i++){let x=cam.x+((i*93+clock*22)%Math.max(W,1)),y=cam.y+((i*137-clock*38+H*3)%Math.max(H,1));ellipse(x,y,2+rnd(i)*3,2+rnd(i)*3,'#b1faff40')}}penguin(player.x,player.y,1,player.face,player.dive,player.slide,player.z);for(const p of particles){ctx.globalAlpha=p.life;ellipse(p.x,p.y,3,3,p.col)}ctx.globalAlpha=1;ctx.restore();const vignette=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);vignette.addColorStop(0,'#00000000');vignette.addColorStop(1,'#001d3b77');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);for(const f of snow){let x=(f.x*W+clock*f.v*13)%(W+20),y=(f.y*H+clock*f.v*22)%(H+20);ellipse(x,y,f.s,f.s,'#efffff99')}drawMap()}
function drawMap(){const mw=94,mh=75,x=W-mw-12,y=Math.max(82,Math.min(H*.25,125));ctx.fillStyle='#062b4bc7';ctx.strokeStyle='#a6efff77';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,mw,mh,11);ctx.fill();ctx.stroke();ctx.save();ctx.beginPath();ctx.roundRect(x+3,y+3,mw-6,mh-6,8);ctx.clip();ctx.fillStyle='#16739b';ctx.fillRect(x+3,y+3,mw-6,mh-6);ellipse(x+mw*.48,y+mh*.49,30,23,'#d3f3fa');ctx.fillStyle='#a2c6df';ctx.fillRect(x+38,y+9,31,13);ctx.fillStyle='#224d78';ctx.fillRect(x+65,y+10,14,15);ellipse(x+player.x/world.w*mw,y+player.y/world.h*mh,4,4,'#ffb74b','#fff',1.5);ctx.restore()}
function frame(t){let dt=Math.min((t-last)/1000||.016,.04);last=t;update(dt);render();requestAnimationFrame(frame)}cam.x=player.x-innerWidth/2;cam.y=player.y-innerHeight*.46;requestAnimationFrame(frame);
})();
</script></body></html>
